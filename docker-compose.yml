services:
  app:
    build: .
    image: budget-redo:latest
    ports:
      - "3001:3000"
    env_file: .env
    environment:
      - ROOT_URL=https://budget.visitmy.app
      - MONGO_URL=mongodb://mongo:27017/budget
      - PORT=3000
      - HTTP_FORWARDED_COUNT=1
      # Without this the container runs UTC, so /api/bills computes its default
      # window a day ahead between 7pm and midnight local and drops bills due
      # today. Matches the host and the openclaw container.
      - TZ=America/Chicago
    depends_on:
      mongo:
        condition: service_started
    restart: unless-stopped

  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

volumes:
  mongo-data:
